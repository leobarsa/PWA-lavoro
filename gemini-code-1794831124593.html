<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Foglio di Calcolo PWA</title>
  <meta name="theme-color" content="#0d6efd">
  <link rel="manifest" href="./manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="d-flex flex-column vh-100 overflow-hidden">

  <!-- Barra superiore e Barra della formula -->
  <header class="bg-light border-bottom p-2">
    <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
      <span class="fw-bold text-primary">MiniSheet 100×100</span>
      <button id="btn-export" class="btn btn-sm btn-outline-secondary">Esporta CSV</button>
      <button id="btn-clear" class="btn btn-sm btn-outline-danger">Svuota</button>
      <span id="offline-badge" class="badge bg-success ms-auto">Online</span>
    </div>
    <div class="input-group input-group-sm">
      <span id="active-cell-label" class="input-group-text fw-bold" style="min-width: 60px; justify-content: center;">A1</span>
      <span class="input-group-text fst-italic">fx</span>
      <input type="text" id="formula-bar" class="form-control font-monospace" placeholder="Inserisci valore o formula (es. =SOMMA(A1:A5))">
    </div>
  </header>

  <!-- Viewport virtualizzato della griglia -->
  <main id="grid-viewport" class="flex-grow-1 position-relative overflow-auto bg-white">
    <div id="grid-spacer"></div>
    <div id="grid-content" class="position-sticky top-0 start-0"></div>
  </main>

  <script src="./js/coordinates.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
